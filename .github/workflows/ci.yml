name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # ecto_foundationdb requires 7.3 or newer: on a 7.1.26 client the
      # adapter's get_mapped_range call raises ArgumentError and every
      # indexed query fails. See rfd/0005-ecto-foundationdb-composite-keys.md.
      FDB_VERSION: "7.3.76"
    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.20"
          otp-version: "29"

      - name: Restore deps cache
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-1.20-29-${{ hashFiles('mix.lock') }}

      - name: Install FoundationDB ${{ env.FDB_VERSION }}
        run: |
          curl -fsSL -o /tmp/fdb-clients.deb \
            "https://github.com/apple/foundationdb/releases/download/${FDB_VERSION}/foundationdb-clients_${FDB_VERSION}-1_amd64.deb"
          curl -fsSL -o /tmp/fdb-server.deb \
            "https://github.com/apple/foundationdb/releases/download/${FDB_VERSION}/foundationdb-server_${FDB_VERSION}-1_amd64.deb"
          sudo dpkg -i /tmp/fdb-clients.deb /tmp/fdb-server.deb
          # The clients package provides libfdb_c.so, which erlfdb's NIF
          # links against. The server package provides /usr/sbin/fdbserver,
          # which EctoFoundationDB.Sandbox starts its own single-node
          # cluster with -- the test needs no separately configured
          # database. The server package's postinst configures one anyway,
          # so just confirm it came up rather than fight it.
          for i in $(seq 1 30); do
            fdbcli --exec 'status minimal' | grep -q 'The database is available' && break
            sleep 2
          done
          fdbcli --exec status minimal

      - run: mix deps.get
      - run: mix format --check-formatted
      - run: mix compile --warnings-as-errors

      - name: Run the TPC-C workload against real FoundationDB
        run: mix test --trace
